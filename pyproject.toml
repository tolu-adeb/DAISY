[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abg-terminal"
version = "3.0.0"
description = "ABG Intelligence Terminal - multi-source stock analysis engine for AI Business Group"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AI Business Group" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.2",
  "httpx>=0.25",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "typer>=0.12",
  "rich>=13",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "tzdata>=2024.1",
  "websockets>=12",
  "pyyaml>=6",            # swing desk rules file
  "beautifulsoup4>=4.12", # swing desk Discord-export parser
  "requests>=2.31",       # swing desk price fetch
  "pypdf>=4",             # research-paper queue
]

[project.optional-dependencies]
yfinance = ["yfinance>=0.2.50"]
fast = ["scipy>=1.10"]
parquet = ["pyarrow>=14"]
desktop = ["plyer>=2.1"]
charts = ["matplotlib>=3.7"]
deck = ["python-pptx>=0.6.21", "pillow>=9"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
agents = ["strands-agents[anthropic]>=1.62,<2", "strands-agents-evals>=1.7,<2", "mcp>=1.10"]
all = ["yfinance>=0.2.50", "scipy>=1.10", "pyarrow>=14", "plyer>=2.1", "matplotlib>=3.7", "python-pptx>=0.6.21", "pillow>=9", "pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
abg = "abg.cli:app"

# Third-party plug-ins register here (see docs/05-extending.md):
# [project.entry-points."abg.providers"]     myvendor = "my_pkg.provider:MyVendorProvider"
# [project.entry-points."abg.risk_models"]   garch    = "my_pkg.risk:GarchRiskModel"

[tool.setuptools.packages.find]
include = ["abg*"]

[tool.setuptools.package-data]
abg = ["api/static/*", "api/static/vendor/*", "api/static/daisy/*", "api/static/daisy/fonts/*", "agents/sops/*.md", "assets/*.pptx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
