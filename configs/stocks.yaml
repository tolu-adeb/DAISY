# Stocks Rule Book — default parameters. Every value here is documented in the rule book.
# Tune only on training years (see walk-forward); never on the holdout.

start: 2007-01-03          # first trading day of the backtest (indicators warm up on earlier data)
end: null                  # null = last date in the data
initial_equity: 100000
benchmark: SPY
events_file: configs/events.csv

data:
  dir: data/stocks         # one CSV per ticker: date,open,high,low,close,volume (adjusted)
  membership: null         # data/stocks/membership.csv  (ticker,start,end) strongly recommended
  sectors: null
  sentiment: null          # date,ticker,score in [-1,1]; optional
  macro: null              # date,T10Y2Y,HY_OAS; optional (FRED)

# tickers that are never part of the single-stock universe
non_stock_tickers: [SPY, QQQ, IWM, DIA, EFA, EEM, XLB, XLC, XLE, XLF, XLI, XLK, XLP, XLRE, XLU, XLV, XLY,
                    IEF, TLT, SHY, BIL, GLD, HYG, LQD, SH, VIX, VIX3M]

costs:
  commission_bps: 1.0
  slippage_bps: 5.0
  borrow_bps_per_year: 50

regime:
  sma_long: 200
  ret_sma: 20
  vol_window: 20
  vol_lookback: 252
  vol_high_pct: 0.80
  er_window: 20
  er_trend: 0.30

stress:                    # early-warning flags -> stress score -> crisis mode
  enabled: true
  enter: 0.50              # crisis on when >= 50% of available flags are on
  exit: 0.25
  min_days: 10
  vol_pct: 0.80
  drawdown: 0.10
  vix_level: 25
  vix_ratio: 1.0
  credit_drop: 0.02
  defensive_lead: 0.05
  breadth: 0.40
  breadth_min_names: 20
  corr_pct: 0.90
  hy_jump: 0.75
  correlation_etfs: [XLB, XLE, XLF, XLI, XLK, XLP, XLU, XLV, XLY]
  exclude_from_breadth: [SPY, QQQ, IWM, DIA, EFA, EEM, XLB, XLC, XLE, XLF, XLI, XLK, XLP, XLRE, XLU, XLV, XLY,
                         IEF, TLT, SHY, BIL, GLD, HYG, LQD, SH, VIX, VIX3M]

allocation:
  method: hedge            # hedge | fixed
  fixed_weights: null      # e.g. {dual_momentum: 0.4, xs_momentum: 0.3, trend_pullback: 0.2, mean_reversion: 0.1}
  hedge_eta: null          # null = sqrt(8 ln N / horizon)
  hedge_horizon_months: 60
  hedge_floor: 0.10
  hedge_clip: 0.10         # monthly book return clipped to +/-10% before the loss mapping
  vol_target: 0.12         # portfolio volatility target (annualized)
  vol_window: 20
  vol_scale_min: 0.5
  vol_scale_max: 1.0       # 1.0 = never lever up

risk:
  max_gross: 1.0
  max_name_weight: 0.10
  dd_kill: 0.20
  dd_pause_days: 20

books:
  dual_momentum:
    enabled: true
    etf_universe: true
    universe: [XLB, XLE, XLF, XLI, XLK, XLP, XLU, XLV, XLY, XLC, XLRE, QQQ, IWM, EFA, EEM]
    defensive: [IEF, TLT, GLD, SHY]
    top_k: 3
    min_change: 0.02
    regimes: {bull_trend: 1.0, bull_chop: 1.0, risk_off: 1.0, crisis: 1.0}

  xs_momentum:
    enabled: true
    universe: all
    min_price: 5
    min_adv_usd: 20000000
    top_n: 20
    max_weight: 0.10
    min_score: 0.0
    min_change: 0.01
    regimes: {bull_trend: 1.0, bull_chop: 1.0, risk_off: 0.0, crisis: 0.0}

  trend_pullback:
    enabled: true
    universe: all
    min_price: 5
    min_adv_usd: 20000000
    rsi_pullback: 40
    rsi_exit: 70
    stop_atr: 2.0
    trail_atr: 3.0
    max_hold: 30
    risk_per_trade: 0.005
    max_weight: 0.10
    max_positions: 10
    sentiment_floor: -0.70
    regimes: {bull_trend: 1.0, bull_chop: 0.5, risk_off: 0.0, crisis: 0.0}
    ml:
      enabled: false
      threshold: 0.55
      horizon: 15
      pt_atr: 2.0
      sl_atr: 2.0
      min_train_events: 200
      fallback: rules      # before a model exists: rules (trade) or skip

  mean_reversion:
    enabled: true
    universe: all
    min_price: 5
    min_adv_usd: 20000000
    rsi_period: 2
    rsi_entry: 10
    rsi_exit: 70
    require_bb: false
    stop_atr: 2.5
    max_hold: 7
    risk_per_trade: 0.005
    max_weight: 0.10
    max_positions: 10
    sentiment_floor: -0.70
    regimes: {bull_trend: 0.5, bull_chop: 1.0, risk_off: 0.0, crisis: 0.0}

  crisis_alpha:
    enabled: true
    budget: 0.70           # share of equity this book controls in crisis mode; other books share the rest
    defensive: [IEF, TLT, GLD, SHY]
    defensive_weight: 0.70
    short_weight: 0.30     # 0 disables the index short
    inverse_etf: null      # e.g. SH to stay long-only
    rebound_weight: 0.25   # 0 disables capitulation rebounds
    rebound_rsi: 5
    rebound_days: 10
    rebalance_days: 5
    min_change: 0.02

# ---------------------------------------------------------------------------------------------------
# Pitch write-ups (docs/21.6). None of these change which trades fire or how the books size them:
# they shape how each signal is explained and planned for the fund. Every number is computed in code.
pitch:
  entry_zone_atr: 0.5         # entry zone shown around the last close, in ATRs (the tested entry is the open)
  chase_atr: 1.0              # untested refinement: skip a long that opens this many ATRs above the close
  earnings_days: 10           # earnings this close to the entry offer a "wait for the print" alternative
  min_rr: 1.5                 # reward:risk to T1 below this is flagged in the plan
  risk_per_trade: 0.005       # share of the fund risked to the stop, before the conviction scale
  max_position_pct: 0.10      # hard cap on one position as a share of the fund (analysts propose 5-12%)
  fund_equity: null           # the fund's size in $ for share counts; null = the paper book's equity
  size_scale: {High: 1.0, Medium: 0.75, Low: 0.5}   # risk multiplier per conviction bucket
  scenario_weights: {bear: 0.25, base: 0.50, bull: 0.25}   # probability-weighted 12-month target
  valuation_agree_upside: 0.15  # 12-month upside at/above this counts as valuation agreeing with a buy
  horizon_months: 12
  buckets: {High: 70, Medium: 45}   # conviction score cut-offs (below Medium = Low)
  min_base_trades: 30         # base rates from fewer replayed trades are flagged as a small sample
  conviction:                 # points added to a start of 50, clamped to 0..100; every hit is listed in the pitch
    start: 50
    gates_all: 10             # every check the rule made passed
    gates_missing: -15
    ml_above: 10              # walk-forward model odds at/above its threshold (only when the ML gate is on)
    ml_below: -10
    valuation_agrees: 10
    valuation_disagrees: -8   # buying with negative 12-month upside
    horizons_disagree: -7     # trade view and probability-weighted 12-month view point opposite ways
    regime: {bull_trend: 5, bull_chop: 0, risk_off: -10, crisis: -15, warmup: -5}
    flag_each: -3             # per early-warning flag on ...
    flags_max: -12            # ... down to this
    earnings_in_hold: -10
    no_fundamentals: -5
    small_sample: -5
  glossary: true              # glossary at the bottom of every memo
  ai_infrastructure: [NVDA, AVGO, AMD, TSM, ASML, MU, ARM, MRVL, ANET, AMAT, LRCX, KLAC, CDNS, SNPS, SMCI,
                      DELL, HPE, VRT, ETN, PWR, GEV, CEG, VST, NEE, TLN, EQIX, DLR, ORCL, MSFT, AMZN, GOOGL,
                      GOOG, META, CRWV, NBIS, COHR, CIEN, GLW]   # the fund's AI focus; a tag, not a signal
